trigger:
  branches:
    include:
      - main

pool: TerraPipeTest

stages:
  - stage: TerraformValidate
    displayName: Validation of Terraform code

    jobs:
      - job: TerraformValidateJob
        displayName: Terraform Validate

        steps:

          - powershell: |
              Write-Host "Checking Terraform..."
              where.exe terraform
              terraform version
            displayName: 'Check Terraform Installation'

          - task: TerraformTask@5
            displayName: Terraform Validate
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'