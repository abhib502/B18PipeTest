trigger:
  branches:
    include:
      - main

pool: TerraPipeTest

stages:

  - stage: TerraformInit
    displayName: Init Terraform
    jobs:
      - job: 
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
            backendServiceArm: 'Azure subscription 1(1c6890b7-c564-42bb-ab37-1a64b84c9937)'
            backendAzureRmStorageAccountName: 'rgakhstg'
            backendAzureRmContainerName: 'rgakhstgcont'
            backendAzureRmKey: 'dev.terraform.tfstate'

  - stage: TerraformValidate
    displayName: Validation of Terraform code

    jobs:
      - job: TerraformValidateJob
        displayName: Terraform Validate

        steps:

          - powershell: |
              Write-Host "Checking Terraform..."
              where.exe terraform
              terraform version
            displayName: 'Check Terraform Installation'

          - task: TerraformTask@5
            displayName: Terraform Validate
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'