trigger:
 branches:
   include:
     - main

pr:
 branches:
   include:
     - main

pool: TerraPipeTest

stages:
- stage: Validate
  displayName: 'Terraform Validate'
  jobs:
  - job: TerraformValidate
    displayName: 'Validate Terraform'
    steps:
    - script: echo "Terraform validation stage"
      displayName: 'Test Validation'

- stage: Plan
  displayName: 'Terraform Plan'
  dependsOn: Validate
  jobs:
  - job: TerraformPlan
    displayName: 'Terraform Plan'
    steps:
    - script: echo "Terraform plan stage"
      displayName: 'Test Plan'

- stage: Apply
  displayName: 'Terraform Apply'
  dependsOn: Plan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: TerraformApply
    displayName: 'Terraform Apply'
    steps:
    - script: echo "Terraform apply stage"
      displayName: 'Test Apply'
