name: "My first workflow"

on:
  push:
    branches:
      - main
      - feature/*

jobs:
  deploy:
    name: print hello
    runs-on: [self-hosted, x64]
    steps:
      - name: Printing
        shell: powershell
        run: |
          echo "Hello World!"
          
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Terraform setup
        uses: hashicorp/setup-terraform@v4

      - name: Terraform format
        run: terraform fmt
