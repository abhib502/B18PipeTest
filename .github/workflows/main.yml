name: "My first workflow"

on:
  push:
    branches:
      - main
      - feature/*

jobs:
  deploy:
    name: print hello
    runs-on: [self-hosted, x64]
    steps:
      - name: Printing
        shell: powershell
        run: |
          echo "Hello World!"
          
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Terraform setup
        uses: hashicorp/setup-terraform@v4

      - name: Check Workspace
        shell: powershell
        run: |
          Write-Host "Workspace: ${{ github.workspace }}"
          Write-Host "Current Directory:"
          Get-Location

          Write-Host "Terraform files location:"
          Get-ChildItem -Recurse -Filter "*.tf" |
            Select-Object FullName

          Write-Host "Terraform Files:"
          Get-ChildItem "${{ github.workspace }}\environment\dev"

      - name: Terraform Validation
        run: terraform validate
